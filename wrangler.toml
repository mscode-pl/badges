name = "badges"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true
routes = [{ pattern = "badges.mscode.pl", custom_domain = true }]

[assets]
directory = "./public"

[[rules]]
type = "Data"
globs = ["**/*.ttf", "**/*.woff"]
fallthrough = false

[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true
